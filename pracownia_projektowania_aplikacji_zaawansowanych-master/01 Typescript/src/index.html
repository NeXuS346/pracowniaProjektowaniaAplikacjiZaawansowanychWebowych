<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="bg-white w-25 position-absolute top-50 start-50 translate-middle h-100">
        <h1>Co masz dzisiaj zrobić?</h1>
        <label for="todoInput">Dodaj zadanie</label>
        <input type="text" id="todoInput"/>
        <button type="button" id="btnDodaj" class="btn btn-success">Dodaj zadanie</button>

        <div id="todoContainer"></div>

    </div>
</body>
</html>

<script type="module" src="/dist/main.js" defer></script>
